name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/claim-management-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/claim-management-frontend

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. Test
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: nphies_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run backend tests
        run: mvn test -B
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: test_password
          JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWZvci1jaS1vbmx5
          NPHIES_MASTER_KEY_BASE64: YOUR_AES_MASTER_KEY_BASE64_HERE

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Build & push Docker images
  # ────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=uat,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'uat' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'uat' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ────────────────────────────────────────────────────────────────────────────
  # 3a. Deploy to UAT  (develop branch)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-uat:
    name: Deploy → UAT
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/develop'
    environment: uat

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to UAT server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: docker-compose.yml
          target: ~/claim-management

      - name: Write .env and deploy on UAT server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NPHIES_MASTER_KEY_BASE64: ${{ secrets.NPHIES_MASTER_KEY_BASE64 }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          TRACARE_INTERNAL_API_KEY: ${{ secrets.TRACARE_INTERNAL_API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UAT_DOMAIN: ${{ secrets.UAT_DOMAIN }}
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          envs: DB_PASSWORD,JWT_SECRET,NPHIES_MASTER_KEY_BASE64,BOOTSTRAP_ADMIN_PASSWORD,TRACARE_INTERNAL_API_KEY,REPO_OWNER,GH_ACTOR,GH_TOKEN,UAT_DOMAIN
          script: |
            set -e
            cd ~/claim-management

            # Write app secrets
            echo "DB_PASSWORD=${DB_PASSWORD}" > .env
            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "NPHIES_MASTER_KEY_BASE64=${NPHIES_MASTER_KEY_BASE64}" >> .env
            echo "BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}" >> .env
            echo "TRACARE_INTERNAL_API_KEY=${TRACARE_INTERNAL_API_KEY}" >> .env
            echo "IMAGE_REGISTRY=ghcr.io/${REPO_OWNER}" >> .env
            echo "IMAGE_TAG=uat" >> .env
            echo "HTTP_PORT=8081" >> .env
            chmod 600 .env

            # Pull and restart containers
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            # Configure Apache2 reverse proxy
            CONF=/etc/apache2/sites-available/claim-management.conf
            echo "<VirtualHost *:80>" | sudo tee "$CONF" > /dev/null
            echo "    ServerName ${UAT_DOMAIN}" | sudo tee -a "$CONF" > /dev/null
            echo "    ProxyPreserveHost On" | sudo tee -a "$CONF" > /dev/null
            echo "    ProxyRequests Off" | sudo tee -a "$CONF" > /dev/null
            echo "    ProxyPass / http://127.0.0.1:8081/" | sudo tee -a "$CONF" > /dev/null
            echo "    ProxyPassReverse / http://127.0.0.1:8081/" | sudo tee -a "$CONF" > /dev/null
            echo "    ErrorLog /var/log/apache2/claim-management-error.log" | sudo tee -a "$CONF" > /dev/null
            echo "    CustomLog /var/log/apache2/claim-management-access.log combined" | sudo tee -a "$CONF" > /dev/null
            echo "</VirtualHost>" | sudo tee -a "$CONF" > /dev/null

            sudo a2enmod proxy proxy_http
            sudo a2ensite claim-management.conf
            sudo apache2ctl configtest
            sudo systemctl reload apache2

  # ────────────────────────────────────────────────────────────────────────────
  # 3b. Deploy to Production  (main branch — requires manual approval)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: production        # configure required reviewers in GitHub repo settings

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to Prod server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: docker-compose.yml
          target: ~/claim-management

      - name: Write .env and deploy on Prod server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NPHIES_MASTER_KEY_BASE64: ${{ secrets.NPHIES_MASTER_KEY_BASE64 }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          TRACARE_INTERNAL_API_KEY: ${{ secrets.TRACARE_INTERNAL_API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: DB_PASSWORD,JWT_SECRET,NPHIES_MASTER_KEY_BASE64,BOOTSTRAP_ADMIN_PASSWORD,TRACARE_INTERNAL_API_KEY,REPO_OWNER,GH_ACTOR,GH_TOKEN
          script: |
            set -e
            cd ~/claim-management
            echo "DB_PASSWORD=${DB_PASSWORD}" > .env
            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "NPHIES_MASTER_KEY_BASE64=${NPHIES_MASTER_KEY_BASE64}" >> .env
            echo "BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}" >> .env
            echo "TRACARE_INTERNAL_API_KEY=${TRACARE_INTERNAL_API_KEY}" >> .env
            echo "IMAGE_REGISTRY=ghcr.io/${REPO_OWNER}" >> .env
            echo "IMAGE_TAG=latest" >> .env
            chmod 600 .env
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
